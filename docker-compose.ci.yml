name: identity-service-ci

services:
  api:
    build:
      context: .
      dockerfile: Identity.Service.Web/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: identity-service-api:ci
    networks:
      - ci-net

  db:
    image: postgres:16
    networks:
      - ci-net

  pgadmin:
    image: dpage/pgadmin4:8
    networks:
      - ci-net

networks:
  ci-net:
    driver: bridge
