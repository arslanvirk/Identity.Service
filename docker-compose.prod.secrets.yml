name: identity-service-prod

services:
  api:
    image: ghcr.io/arslanvirk/identity.service:${IMAGE_TAG:-latest}
    container_name: identity-service-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Read secrets from Docker secrets (mounted as files)
      Jwt__Issuer__File: /run/secrets/jwt_issuer
      Jwt__Audience__File: /run/secrets/jwt_audience
      Jwt__SigningKey__File: /run/secrets/jwt_signing_key
      ConnectionStrings__DefaultConnection__File: /run/secrets/connection_string
    secrets:
      - jwt_issuer
      - jwt_audience
      - jwt_signing_key
      - connection_string
    ports:
      - "8080:8080"
    networks:
      - identity-net
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: ghcr.io/arslanvirk/identity.service.db:${IMAGE_TAG:-latest}
    container_name: identity-service-db
    environment:
      POSTGRES_DB: identitydb
      POSTGRES_USER: postgres
    secrets:
      - source: postgres_password
        target: postgres_password
    # PostgreSQL reads POSTGRES_PASSWORD from file
    command: >
      bash -c "export POSTGRES_PASSWORD=$$(cat /run/secrets/postgres_password) && 
      docker-entrypoint.sh postgres"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identitydb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - identity-net
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  pgadmin:
    image: ghcr.io/arslanvirk/identity.service.pgadmin:${IMAGE_TAG:-latest}
    container_name: identity-service-pgadmin
    secrets:
      - pgadmin_email
      - pgadmin_password
    # pgAdmin reads from files
    entrypoint: >
      /bin/sh -c "
      export PGADMIN_DEFAULT_EMAIL=$$(cat /run/secrets/pgadmin_email) &&
      export PGADMIN_DEFAULT_PASSWORD=$$(cat /run/secrets/pgadmin_password) &&
      export PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY=False &&
      /entrypoint.sh
      "
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - identity-net
    restart: unless-stopped
    deploy:
      replicas: 1

secrets:
  jwt_issuer:
    file: ./secrets/jwt_issuer.txt
  jwt_audience:
    file: ./secrets/jwt_audience.txt
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt
  connection_string:
    file: ./secrets/connection_string.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  pgadmin_email:
    file: ./secrets/pgadmin_email.txt
  pgadmin_password:
    file: ./secrets/pgadmin_password.txt

volumes:
  pgdata:
    driver: local

networks:
  identity-net:
    driver: bridge
