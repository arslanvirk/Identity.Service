name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
REGISTRY: ghcr.io
IMAGE_NAME_API: identity.service
IMAGE_NAME_DB: identity.service.db
IMAGE_NAME_PGADMIN: identity.service.pgadmin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image tags
        run: |
          # API image tags
          echo "API_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_API }}:latest" >> $GITHUB_ENV
          echo "API_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_API }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV
          
          # Database image tags
          echo "DB_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_DB }}:latest" >> $GITHUB_ENV
          echo "DB_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_DB }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV
          
          # pgAdmin image tags
          echo "PGADMIN_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_PGADMIN }}:latest" >> $GITHUB_ENV
          echo "PGADMIN_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_PGADMIN }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV

      - name: Pull base images
        run: |
          docker compose -f docker-compose.ci.yml pull db pgadmin

      - name: Build images with Docker Compose
        run: |
          docker compose -f docker-compose.ci.yml build \
            --build-arg BUILD_CONFIGURATION=Release

      - name: Tag all images
        run: |
          # Tag API images
          docker tag identity-service-api:ci ${{ env.API_TAG_LATEST }}
          docker tag identity-service-api:ci ${{ env.API_TAG_SHA }}
          
          # Tag Database images
          docker tag postgres:16 ${{ env.DB_TAG_LATEST }}
          docker tag postgres:16 ${{ env.DB_TAG_SHA }}
          
          # Tag pgAdmin images
          docker tag dpage/pgadmin4:8 ${{ env.PGADMIN_TAG_LATEST }}
          docker tag dpage/pgadmin4:8 ${{ env.PGADMIN_TAG_SHA }}

      - name: Push all images to GHCR
        run: |
          # Push API images
          docker push ${{ env.API_TAG_LATEST }}
          docker push ${{ env.API_TAG_SHA }}
          
          # Push Database images
          docker push ${{ env.DB_TAG_LATEST }}
          docker push ${{ env.DB_TAG_SHA }}
          
          # Push pgAdmin images
          docker push ${{ env.PGADMIN_TAG_LATEST }}
          docker push ${{ env.PGADMIN_TAG_SHA }}

      - name: Image summary
        run: |
          echo "### ?? Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "? Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "?? **Images pushed to GHCR:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### API Service" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.API_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.API_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### PostgreSQL Database" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DB_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DB_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### pgAdmin" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.PGADMIN_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.PGADMIN_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "?? **View Packages:** [GitHub Container Registry](https://github.com/${{ github.repository_owner }}?tab=packages)" >> $GITHUB_STEP_SUMMARY
