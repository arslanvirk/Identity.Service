name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: identity.service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set image tags in compose file
        run: |
          export IMAGE_TAG_LATEST="${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME }}:latest"
          export IMAGE_TAG_SHA="${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}"
          echo "IMAGE_TAG_LATEST=${IMAGE_TAG_LATEST}" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=${IMAGE_TAG_SHA}" >> $GITHUB_ENV

      - name: Build images with Docker Compose
        run: |
          docker compose -f docker-compose.ci.yml build \
            --build-arg BUILD_CONFIGURATION=Release

      - name: Tag images
        run: |
          docker tag identity-service-api:ci ${{ env.IMAGE_TAG_LATEST }}
          docker tag identity-service-api:ci ${{ env.IMAGE_TAG_SHA }}

      - name: Push images to GHCR
        run: |
          docker push ${{ env.IMAGE_TAG_LATEST }}
          docker push ${{ env.IMAGE_TAG_SHA }}

      - name: Image summary
        run: |
          echo "### ?? Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "? Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "?? **Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "?? **Registry:** [GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
