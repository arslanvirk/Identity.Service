name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
REGISTRY: ghcr.io
IMAGE_NAME_API: identity.service
IMAGE_NAME_DB: identity.service.db
IMAGE_NAME_PGADMIN: identity.service.pgadmin
IMAGE_NAME_KEYCLOAK: identity.service.keycloak
COMPOSE_FILE: docker-compose.yml
COMPOSE_PROFILE: ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout repository source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Enable Docker Buildx for better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3) Authenticate to GHCR using GitHub-provided token
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4) Create reusable tags based on repo owner + commit SHA
      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 5) Export tags for API/DB/pgAdmin/Keycloak images
      - name: Set image tags
        run: |
          echo "API_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_API }}:latest" >> $GITHUB_ENV
          echo "API_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_API }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV
          echo "DB_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_DB }}:latest" >> $GITHUB_ENV
          echo "DB_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_DB }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV
          echo "PGADMIN_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_PGADMIN }}:latest" >> $GITHUB_ENV
          echo "PGADMIN_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_PGADMIN }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV
          echo "KEYCLOAK_TAG_LATEST=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_KEYCLOAK }}:latest" >> $GITHUB_ENV
          echo "KEYCLOAK_TAG_SHA=${{ env.REGISTRY }}/${{ steps.meta.outputs.repo_owner }}/${{ env.IMAGE_NAME_KEYCLOAK }}:${{ steps.meta.outputs.sha_short }}" >> $GITHUB_ENV

      # 6) Pull base images used by compose
      - name: Pull base images
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} --profile ${{ env.COMPOSE_PROFILE }} pull db-ci pgadmin-ci keycloak-ci

      # 7) Build API image from source
      - name: Build images with Docker Compose
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} --profile ${{ env.COMPOSE_PROFILE }} build api-ci

      # 8) Tag images for GHCR (latest + SHA)
      - name: Tag all images
        run: |
          docker tag identity-service-api:ci ${{ env.API_TAG_LATEST }}
          docker tag identity-service-api:ci ${{ env.API_TAG_SHA }}
          docker tag postgres:16-alpine ${{ env.DB_TAG_LATEST }}
          docker tag postgres:16-alpine ${{ env.DB_TAG_SHA }}
          docker tag dpage/pgadmin4:8 ${{ env.PGADMIN_TAG_LATEST }}
          docker tag dpage/pgadmin4:8 ${{ env.PGADMIN_TAG_SHA }}
          docker tag quay.io/keycloak/keycloak:26.5.2 ${{ env.KEYCLOAK_TAG_LATEST }}
          docker tag quay.io/keycloak/keycloak:26.5.2 ${{ env.KEYCLOAK_TAG_SHA }}

      # 9) Push images to GHCR
      - name: Push all images to GHCR
        run: |
          docker push ${{ env.API_TAG_LATEST }}
          docker push ${{ env.API_TAG_SHA }}
          docker push ${{ env.DB_TAG_LATEST }}
          docker push ${{ env.DB_TAG_SHA }}
          docker push ${{ env.PGADMIN_TAG_LATEST }}
          docker push ${{ env.PGADMIN_TAG_SHA }}
          docker push ${{ env.KEYCLOAK_TAG_LATEST }}
          docker push ${{ env.KEYCLOAK_TAG_SHA }}

      # 10) Publish summary in GitHub Actions UI
      - name: Image summary
        run: |
          echo "### ?? Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "? Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "?? **Images pushed to GHCR:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### API Service" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.API_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.API_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### PostgreSQL Database" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DB_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.DB_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### pgAdmin" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.PGADMIN_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.PGADMIN_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Keycloak" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.KEYCLOAK_TAG_LATEST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.KEYCLOAK_TAG_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "?? **View Packages:** [GitHub Container Registry](https://github.com/${{ github.repository_owner }}?tab=packages)" >> $GITHUB_STEP_SUMMARY
