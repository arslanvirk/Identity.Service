# ============================================================================
# IDENTITY SERVICE - DOCKER COMPOSE (DEV + CI)
# ============================================================================
# Profiles:
#   dev - Local development (build from source)
#   ci  - CI builds (no ports/volumes)
#
# Usage:
#   Local dev: COMPOSE_PROFILES=dev docker compose up -d --build
#   CI build:  docker compose --profile ci build api-ci
# ============================================================================

name: identity-service

# Common API settings reused by dev services
x-api-common: &api-common
  ports:
    - "8080:8080"
  networks:
    - identity-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

# Common database settings reused by dev services
x-db-common: &db-common
  ports:
    - "5432:5432"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d identitydb"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s
  volumes:
    - pgdata:/var/lib/postgresql/data
  networks:
    - identity-net
  restart: unless-stopped

# Common pgAdmin settings reused by dev services
x-pgadmin-common: &pgadmin-common
  ports:
    - "5050:80"
  networks:
    - identity-net
  restart: unless-stopped
  volumes:
    - pgadmin-data:/var/lib/pgadmin

# Common Keycloak settings reused by dev services
x-keycloak-common: &keycloak-common
  ports:
    - "8180:8080"
  networks:
    - identity-net
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
  # --------------------------------------------------------------------------
  # DEV PROFILE (local build)
  # --------------------------------------------------------------------------
  api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Identity.Service.Web/Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    image: identity.service.web:dev
    container_name: identity-service-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: ${JWT_ISSUER:-http://identity.local}
      Jwt__Audience: ${JWT_AUDIENCE:-identity-clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-signing-key-change-me}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:-Host=db;Port=5432;Database=identitydb;Username=postgres;Password=DevPassword123;Pooling=true}
    <<: *api-common

  db:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: identity-service-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPassword123}
      POSTGRES_DB: ${POSTGRES_DB:-identitydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    <<: *db-common

  pgadmin:
    profiles: ["dev"]
    image: dpage/pgadmin4:8
    container_name: identity-service-pgadmin
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local.test","localhost","test","example.com"]'
    <<: *pgadmin-common

  keycloak:
    profiles: ["dev"]
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: identity-service-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    <<: *keycloak-common

  # --------------------------------------------------------------------------
  # CI PROFILE (build only)
  # --------------------------------------------------------------------------
  api-ci:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: Identity.Service.Web/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    image: identity-service-api:ci
    networks:
      - identity-net

  db-ci:
    profiles: ["ci"]
    image: postgres:16-alpine
    networks:
      - identity-net

  pgadmin-ci:
    profiles: ["ci"]
    image: dpage/pgadmin4:8
    networks:
      - identity-net

  keycloak-ci:
    profiles: ["ci"]
    image: quay.io/keycloak/keycloak:26.5.2
    networks:
      - identity-net

volumes:
  pgdata:
    driver: local
  pgadmin-data:
    driver: local

networks:
  identity-net:
    driver: bridge